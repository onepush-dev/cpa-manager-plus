name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cliproxyapi/**', 'manager/**', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: cliproxyapi
            image: ghcr.io/onepush-dev/cpa-cliproxyapi
            version: 8.0.51
          - context: manager
            image: ghcr.io/onepush-dev/cpa-manager-plus
            version: 1.14.10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ matrix.version }}
          platforms: linux/amd64
